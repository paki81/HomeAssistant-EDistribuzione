recupera_storico:
  name: Recupera storico
  description: >-
    Richiede a E-Distribuzione entrambe le direzioni dell'energia (prelevata
    e immessa) per un periodo passato e le importa, con una sola richiesta
    per direzione per l'intero periodo (confermato funzionante fino a 181
    giorni in un'unica risposta). Il recupero dello storico non è
    automatico: sei tu a decidere quando e quanto recuperare.
    Per periodi più lunghi ripeti l'azione su intervalli consecutivi.
  fields:
    device_id:
      name: Configurazione / POD
      description: >-
        Scegli il dispositivo per cui recuperare lo storico. Il dispositivo
        "E-Distribuzione" (account) recupera tutti i POD della
        configurazione insieme; il dispositivo di un singolo POD limita il
        recupero solo a quello.
      required: true
      selector:
        device:
          filter:
            integration: edistribuzione
    data_da:
      name: Data inizio
      description: Primo giorno del periodo da recuperare.
      required: true
      example: "2026-08-01"
      selector:
        date:
    data_a:
      name: Data fine
      description: >-
        Ultimo giorno del periodo da recuperare. I dati sono disponibili con
        un giorno di ritardo, quindi al massimo ieri.
      required: true
      example: "2026-08-31"
      selector:
        date:

configura_energy_dashboard:
  name: Configura Energy Dashboard
  description: >-
    Aggiunge alla Energy Dashboard le statistiche di tutti i POD configurati,
    in base al ruolo assegnato a ciascuno (scambio -> sorgente rete,
    produzione -> sorgente solare). Azione idempotente: non sovrascrive né
    duplica sorgenti già presenti (incluse quelle configurate a mano), sicura
    da rilanciare dopo aver aggiunto un POD o cambiato un ruolo.

esporta_registro:
  name: Esporta registro letture
  description: >-
    Invia al webhook configurato nelle opzioni (es. n8n -> Google Sheets) le
    letture ufficiali mensili di E-Distribuzione per un mese a scelta:
    pensato per il registro delle letture delle officine elettriche
    (impianti oltre 20 kW) richiesto dall'Agenzia delle Dogane. Utile anche
    per il recupero di mesi passati: l'export automatico invia solo il mese
    appena concluso. Richiede il webhook configurato nelle opzioni
    dell'integrazione.
  fields:
    device_id:
      name: Configurazione / POD
      description: >-
        Scegli il dispositivo per cui esportare il mese. Il dispositivo
        "E-Distribuzione" (account) esporta tutti i POD della configurazione
        insieme; il dispositivo di un singolo POD esporta solo quello.
      required: true
      selector:
        device:
          filter:
            integration: edistribuzione
    mese:
      name: Mese
      description: Mese da esportare, nel formato YYYY-MM.
      required: true
      example: "2026-09"
      selector:
        text:
